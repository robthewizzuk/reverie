<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2a1d16">
<title>Reverie</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<main id="app">
  <div id="stage" class="screen">
    <canvas id="view" aria-label="A little creature in a cosy workshop corner"></canvas>
    <p id="caption" aria-live="polite" hidden></p>
    <button id="wake" type="button" hidden>Waking up…</button>
    <div id="timers" hidden aria-live="polite"></div>
    <div id="gamebar" hidden><span></span><div></div></div>
    <button id="recentre" type="button" aria-label="Look back at Reverie" title="Look back at Reverie" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9 3h-2.07A7 7 0 0 0 13 5.07V3h-2v2.07A7 7 0 0 0 5.07 11H3v2h2.07A7 7 0 0 0 11 18.93V21h2v-2.07A7 7 0 0 0 18.93 13H21v-2Zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z"/></svg>
    </button>
    <div id="music" hidden><i aria-hidden="true">♪</i><span></span><button type="button" data-id="connect">Connect Spotify</button><button type="button" data-id="toggle" aria-label="Pause">❚❚</button><button type="button" data-id="next" aria-label="Next song">⏭</button></div>
    <ul id="helpers" aria-label="Reverie's helpers" aria-live="polite" hidden></ul>
    <div id="pad" hidden>
      <p>Draw something, and Reverie will make it real</p>
      <canvas aria-label="Drawing pad"></canvas>
      <div><button type="button" data-id="cancel">Cancel</button><button type="button" data-id="clear">Clear</button><button type="button" data-id="done">Make it!</button></div>
    </div>
    <div id="show" hidden>
      <canvas aria-label="What the camera sees"></canvas>
      <p class="seen" aria-live="polite">Hold something up for Reverie</p>
      <div>
        <button type="button" data-id="close" aria-label="Close the camera">✕</button>
        <button type="button" data-id="flip" aria-label="Switch camera">⟲</button>
        <button type="button" data-id="copy">Make a copy</button>
        <button type="button" data-id="show">Show</button>
      </div>
    </div>
    <div id="diary" hidden>
      <header><h2>Reverie's diary</h2><button type="button" data-id="close" aria-label="Close the diary">✕</button></header>
      <div class="pages"></div>
      <footer><p>Kept only in this browser, never stored on a server.</p><button type="button" data-id="wipe">Forget everything</button></footer>
    </div>
    <div id="ask" role="dialog" aria-modal="false" aria-labelledby="ask-title" hidden>
      <h2 id="ask-title"></h2>
      <div class="what"></div>
      <footer><button type="button" data-id="yes"></button><button type="button" data-id="no"></button></footer>
    </div>
  </div>
  <p id="status" role="status"></p>
  <p id="timing"></p>
  <form id="bar" autocomplete="off">
    <button id="mic" type="button" aria-label="Talk">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
    </button>
    <button id="draw" type="button" aria-label="Draw something for Reverie to make">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25Zm17.71-10.21a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83Z"/></svg>
    </button>
    <button id="look" type="button" aria-label="Show Reverie something with the camera">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 7.2 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.2L15 4H9Zm3 4.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/></svg>
    </button>
    <button id="book" type="button" aria-label="Reverie's diary: what it remembers about you">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3Zm0 16a1 1 0 0 0 0 2h12v-2H6Zm6.5-11.2c-.9-1.5-3.5-1.2-3.5.9 0 1.6 2 2.9 3.5 4.3 1.5-1.4 3.5-2.7 3.5-4.3 0-2.1-2.6-2.4-3.5-.9Z"/></svg>
    </button>
    <input id="say" type="text" placeholder="Say something, or type…" enterkeyhint="send" aria-label="Say something">
    <button id="send" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.5 21 12 3 3.5V10l12 2-12 2v6.5Z"/></svg>
    </button>
  </form>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2a1d16">
<title>Reverie</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<main id="app">
  <div id="stage" class="screen">
    <canvas id="view" aria-label="A little creature in a cosy workshop corner"></canvas>
    <p id="caption" aria-live="polite" hidden></p>
    <button id="wake" type="button" hidden>Waking up…</button>
  </div>
  <p id="status" role="status"></p>
  <p id="timing"></p>
  <form id="bar" autocomplete="off">
    <button id="mic" type="button" aria-label="Talk">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
    </button>
    <input id="say" type="text" placeholder="Say something, or type…" enterkeyhint="send" aria-label="Say something">
    <button id="send" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.5 21 12 3 3.5V10l12 2-12 2v6.5Z"/></svg>
    </button>
  </form>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
